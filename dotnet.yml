name: Build ASP.NET Core Starter Kit

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Packages
      run: dotnet restore AspNetCoreStarterKit.sln

    - name: Build Solution
      run: dotnet build AspNetCoreStarterKit.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test AspNetCoreStarterKit.sln --no-build --configuration Release